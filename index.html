<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- user-scalable 막지 않음: 어르신이 손가락으로 더 키울 수 있어야 한다 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FDF0F3">
<title>기억왕</title>

<!-- 홈 화면에 추가했을 때: 아이콘·이름·주소창 없는 앱 화면.
     이게 없으면 아이폰이 첫 글자('기')로 회색 아이콘을 임의로 만든다 -->
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="기억왕">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* 세종글꽃체 (제작: 세종특별자치시).
     라이선스가 '변형하여 재배포'를 금지하므로 woff2로 압축하지 않고 원본 .otf를 그대로 쓴다.
     그래서 5.4MB나 되지만, swap 덕분에 화면은 즉시 뜨고 글씨만 나중에 바뀐다 */
  @font-face {
    font-family: 'Sejong';
    src: url('SejongGeulggot.otf') format('opentype');
    font-display: swap;
  }

  /* 연분홍 바탕 + 진분홍 강조. 금색 왕관이 가장 선명하게 살아나는 조합이라 골랐다.
     글씨는 진한 자주갈색으로 둬서 어르신이 봐도 대비가 충분하게 (5:1 이상) */
  :root {
    --bg: #FDF0F3;
    --card: #FFFFFF;
    --ink: #2D1920;
    --ink-soft: #8C6973;
    --rose: #C2185B;          /* 강조 — 선택된 칩, 카테고리 이름 */
    --rose-light: #F0A0BE;
    --line: #F2DDE3;
    --listening: #8E0038;     /* 듣는 중 — 평소 버튼과 확실히 달라 보여야 한다 */
    --alert: #B3261E;         /* 지우기 */
  }

  /* 글씨는 rem 기준 — 휴대폰 설정에서 글자 크기를 키우면 앱도 같이 커진다 */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 버튼·입력칸은 글꼴을 물려받지 않는 게 브라우저 기본이다. 한 번에 물려받게 해 둔다 */
  button, input { font-family: inherit; }

  body {
    /* 휴대폰용이므로 폭을 제한한다. 넓은 화면에서도 실제 모습대로 보인다 */
    max-width: 30rem;
    margin: 0 auto;
    font-family: 'Sejong', -apple-system, "Apple SD Gothic Neo", sans-serif;
    font-size: 1.25rem;          /* 기본 20px */
    line-height: 1.55;
    color: var(--ink);
    background: var(--bg);
  }

  header {
    /* 검색칸이 있어 머리가 화면 절반을 넘는다. 붙박이로 두면 목록 볼 자리가 없어 안 붙인다 */
    padding: 1.2rem 1rem 0.5rem;
  }

  /* 제목 — 아이콘과 같은 왕관을 써서 홈 화면과 앱 안이 같은 물건으로 보이게 한다 */
  h1 {
    display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    font-size: 1.6rem; margin: 0 0 1rem; color: var(--rose); letter-spacing: 0.05em;
  }
  h1 svg { width: 2rem; height: 1.7rem; flex: none; }

  /* 말하기 버튼 — 화면에서 가장 큰 것 */
  #mic {
    display: block; width: 100%; min-height: 9rem;
    font-size: 2rem; font-weight: 700; color: #46142D;
    background: linear-gradient(160deg, #FBCEDD 0%, var(--rose-light) 45%, #E5789F 100%);
    border: none; border-radius: 2.5rem;
    box-shadow: 0 6px 16px rgba(194, 24, 91, 0.22);
    cursor: pointer;
  }
  #mic:active { transform: translateY(2px); box-shadow: 0 2px 8px rgba(194, 24, 91, 0.22); }
  #mic.listening { background: var(--listening); color: #fff; }
  #mic:disabled { background: #ddd; color: #888; box-shadow: none; }

  #status { min-height: 2rem; margin: 0.6rem 0; text-align: center; color: var(--ink-soft); font-size: 1.1rem; }

  /* 검색 — 분류가 틀려도 찾을 수 있는 안전망 */
  #search {
    width: 100%; min-height: 3.5rem; margin-bottom: 0.9rem; padding: 0 1.1rem;
    font-size: 1.3rem; font-family: inherit; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 1.2rem;
  }
  #search:focus { outline: none; border-color: var(--rose-light); }

  /* 카테고리 필터 — 옆으로 밀어서 본다 */
  #filters { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; }
  #filters button {
    flex: none; min-height: 3.2rem; padding: 0 1.2rem;
    font-size: 1.2rem; font-family: inherit; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 2rem;
    cursor: pointer;
  }
  #filters button.on { background: var(--rose); border-color: var(--rose); color: #fff; font-weight: 700; }
  /* 정리 버튼은 자주 쓸 것이 아니라 눈에 덜 띄게 — 실수로 누르는 걸 줄인다 */
  #filters button.gear { background: none; border-style: dashed; color: var(--ink-soft); }
  #filters button.gear.on { background: var(--ink-soft); border-color: var(--ink-soft); border-style: solid; color: #fff; }

  /* 카테고리 정리 — 필터 줄 바로 아래로 펼쳐진다 */
  #catPanel { margin: 0 1rem; padding: 1rem; background: var(--card); border: 2px solid var(--line); border-radius: 1.2rem; }
  #catPanel[hidden] { display: none; }
  .catrow { display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0; }
  .catrow span:first-child { flex: 1; font-size: 1.3rem; }
  .catrow .fixed { font-size: 1rem; color: var(--ink-soft); }
  .catrow button {
    min-width: 3.2rem; min-height: 3.2rem; padding: 0 0.5rem; font-size: 1.2rem; font-family: inherit;
    color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 0.9rem; cursor: pointer;
  }
  .catrow button:disabled { opacity: 0.3; cursor: default; }
  .catrow button.danger { color: var(--alert); border-color: #EFC3BE; }
  .add {
    width: 100%; min-height: 3.5rem; margin-top: 0.8rem;
    font-size: 1.2rem; font-family: inherit; font-weight: 700;
    color: var(--rose); background: var(--card); border: 2px solid var(--rose); border-radius: 1rem; cursor: pointer;
  }
  .add.danger { color: var(--alert); border-color: var(--alert); }

  #list { list-style: none; margin: 1rem 0 0; padding: 0 1rem 3rem; }
  #list li {
    margin-bottom: 0.8rem; padding: 0 1rem;
    background: var(--card); border: 2px solid var(--line); border-radius: 1.2rem;
  }

  /* 기록 한 칸 — 누르면 아래가 펼쳐진다 */
  .note { width: 100%; padding: 1.1rem 0; background: none; border: none;
          font-family: inherit; color: inherit; text-align: left; cursor: pointer; }
  .head { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.35rem; }
  .cat { font-size: 1rem; color: var(--rose); font-weight: 700; }
  .badge:not(:empty) {
    font-size: 1.1rem; font-weight: 700; color: #8A4B00;
    background: #FFF0D4; border-radius: 0.6rem; padding: 0.1rem 0.6rem;
  }
  /* keep-all: 한글 단어를 중간에서 안 자른다 / anywhere: 긴 영문·숫자는 잘라서 화면 밖으로 안 나가게 */
  .text { display: block; font-size: 1.6rem; word-break: keep-all; overflow-wrap: anywhere; }

  .panel { padding: 0 0 1.2rem; border-top: 2px dashed var(--line); }
  .panel[hidden] { display: none; }
  .panel p { margin: 0.9rem 0 0.6rem; font-size: 1rem; color: var(--ink-soft); }
  .cats { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.2rem; }
  .cats button {
    min-height: 3.2rem; padding: 0 1.2rem; font-size: 1.2rem; font-family: inherit;
    color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 0.9rem; cursor: pointer;
  }
  .cats button.on { background: var(--rose); border-color: var(--rose); color: #fff; font-weight: 700; }

  .done-btn, .del {
    width: 100%; min-height: 3.5rem; font-size: 1.3rem; font-family: inherit;
    background: var(--bg); border-radius: 1rem; cursor: pointer;
  }
  .done-btn { color: #2F6B2F; border: 2px solid #2F6B2F; margin-bottom: 0.6rem; }
  .del { color: var(--alert); border: 2px solid var(--alert); }

  /* 끝난 기록 — 사라지지 않고 흐려진 채 아래로 내려간다 */
  #list li.done { background: #F6EDF0; }
  #list li.done .note { opacity: 0.5; }

  /* 카테고리를 고친 직후에만 뜨는 물음 */
  .learn:not(:empty) { padding: 0.9rem; margin-bottom: 1rem; background: #FFF1F5; border: 2px solid #F5D2DE; border-radius: 1rem; }
  .learn p { margin: 0 0 0.6rem; font-size: 1.1rem; color: var(--ink); }
  .learn small { color: var(--ink-soft); }

  #empty { padding: 3rem 1rem; text-align: center; color: var(--ink-soft); font-size: 1.3rem; }
  #empty[hidden] { display: none; }

  /* 글꼴 출처 — 세종글꽃체 라이선스가 저작권자 표시를 요구한다.
     의무는 지키되 눈에 안 걸리게 작고 흐리게. 다만 읽을 수는 있어야 표시로 인정된다 */
  footer { padding: 0 1rem 2rem; text-align: center; font-size: 0.75rem; color: #B49BA4; }
</style>
</head>
<body>

<header>
  <h1>
    <!-- 왕관은 도형 몇 개라 코드로 직접 그린다. 남의 그림을 안 쓰니 라이선스 문제가 없고,
         파일도 안 받으며, 확대해도 안 깨진다. 홈 화면 아이콘(icon.png)도 같은 좌표로 그렸다 -->
    <svg viewBox="0 8 100 84" aria-hidden="true">
      <path d="M6 80 L6 38 L17 58 L28 24 L39 52 L50 16 L61 52 L72 24 L83 58 L94 38 L94 80 Z" fill="#F5C542"/>
      <circle cx="6" cy="36" r="6.5" fill="#F5C542"/>
      <circle cx="28" cy="22" r="6.5" fill="#F5C542"/>
      <circle cx="50" cy="14" r="6.5" fill="#F5C542"/>
      <circle cx="72" cy="22" r="6.5" fill="#F5C542"/>
      <circle cx="94" cy="36" r="6.5" fill="#F5C542"/>
      <rect x="4" y="74" width="92" height="16" rx="4" fill="#E0A82E"/>
      <path d="M50 52 L58 64 L50 74 L42 64 Z" fill="#E85B7A"/>
    </svg>
    기억왕
  </h1>
  <button id="mic">🎤 말하기</button>
  <p id="status"></p>
  <input id="search" type="search" placeholder="🔍 찾기" autocomplete="off">
  <div id="filters"></div>
</header>

<div id="catPanel" hidden></div>

<p id="empty" hidden>아직 기록이 없어요.<br>위 버튼을 누르고 말해 보세요.</p>
<ul id="list"></ul>

<footer>HSJ · 2026 · 글꼴: 세종글꽃체 (세종특별자치시)</footer>

<script src="classify.js"></script>
<script src="app.js"></script>
</body>
</html>
