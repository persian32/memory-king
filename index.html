<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- user-scalable 막지 않음: 어르신이 손가락으로 더 키울 수 있어야 한다 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#CBF0FA">
<title>기억왕</title>

<!-- 홈 화면에 추가했을 때: 아이콘·이름·주소창 없는 앱 화면.
     이게 없으면 아이폰이 첫 글자('기')로 회색 아이콘을 임의로 만든다 -->
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="기억왕">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* Paperlogy (OFL 1.1, © 2024 PT&). 라이선스 전문은 같은 폴더 OFL.txt.
     굵기가 따로 있는 글꼴이라 브라우저가 굵게를 흉내 낼 일이 없다 — 획이 안 뭉개진다.
     두 종 합쳐 320KB. 앞서 쓰던 5.4MB짜리보다 17배 가벼워 첫 화면이 바로 뜬다 */
  @font-face {
    font-family: 'Paperlogy';
    src: url('Paperlogy-4Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'Paperlogy';
    src: url('Paperlogy-7Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }

  /* 화면 색은 전부 여기 모아 둔다 (왕관의 금색만 예외 — 배경이 뭐든 왕관은 금색이다).
     나중에 색을 바꿀 때 이 블록만 고치면 된다.
     값은 눈대중이 아니라 명도 대비를 계산해서 골랐다 — 어르신이 봐야 하므로
     글씨는 4.5:1, 형태·테두리는 3:1을 기준으로 삼았다 */
  :root {
    /* 바탕과 글씨 */
    /* 하늘색 그라데이션. 단색으로는 '부드러움'과 '흰 카드가 또렷함' 중 하나를 포기해야 한다.
       위는 연해서 말하기 버튼 쪽이 편안하고, 아래는 진해서 기록 칸이 또렷하게 뜬다 */
    --bg-top: #CBF0FA;
    --bg-bottom: #7FD5EE;     /* 흰 카드와 1.66:1 */
    --card: #FFFFFF;
    --ink: #10323F;           /* 흰 카드 위 13.6:1 */
    --ink-soft: #4A7183;      /* 흰 카드 위 5.3:1 */
    --line: #7FC4DE;

    --accent: #08699B;        /* 선택된 칩, 카테고리 이름. 흰 글씨 6.0:1 */

    /* 말하기 버튼 — 그라데이션 양끝 모두 흰 글씨가 읽히는 값으로 잡았다 */
    --mic-top: #0E76A8;       /* 흰 글씨 5.0:1 */
    --mic-bottom: #064E75;    /* 흰 글씨 8.9:1 */
    --listening: #C62828;     /* 듣는 중 — 파랑과 완전히 다른 색이어야 한다 */

    --done: #1B6B3A;          /* 다 했어요 */
    --alert: #B3261E;         /* 지우기 */
    --alert-line: #E3B4AF;

    /* 날짜 뱃지는 금색. 파랑 화면에서 눈에 띄고, 아이콘의 금색 왕관과 이어진다 */
    --badge-bg: #FFF0D4;
    --badge-ink: #8A4B00;

    /* 보조 바탕 */
    --quiet: #EAF2F6;         /* 다 끝난 기록 칸 */
    --learn-bg: #EAF7FD;
    --learn-line: #BFE4F2;
    --footer-ink: #3E7186;
  }

  /* 글씨는 rem 기준 — 휴대폰 설정에서 글자 크기를 키우면 앱도 같이 커진다 */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 버튼·입력칸은 글꼴을 물려받지 않는 게 브라우저 기본이다. 한 번에 물려받게 해 둔다 */
  button, input { font-family: inherit; }

  /* 그라데이션은 html에 건다. body는 폭이 제한돼 있어 거기 걸면 넓은 화면에서
     가운데 기둥에만 칠해지고, 스크롤이 길어지면 무늬가 반복돼 줄이 생긴다.
     fixed: 스크롤해도 배경은 화면에 붙어 있게 — 목록이 길어도 띠가 안 생긴다 */
  html {
    min-height: 100%;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%) fixed;
  }

  body {
    /* 휴대폰용이므로 폭을 제한한다. 넓은 화면에서도 실제 모습대로 보인다 */
    max-width: 30rem;
    margin: 0 auto;
    font-family: 'Paperlogy', -apple-system, "Apple SD Gothic Neo", sans-serif;
    font-size: 1.25rem;          /* 기본 20px */
    line-height: 1.55;
    color: var(--ink);
    background: none;
  }

  header {
    /* 검색칸이 있어 머리가 화면 절반을 넘는다. 붙박이로 두면 목록 볼 자리가 없어 안 붙인다 */
    padding: 1.2rem 1rem 0.5rem;
  }

  /* 제목 — 아이콘과 같은 왕관을 써서 홈 화면과 앱 안이 같은 물건으로 보이게 한다 */
  h1 {
    display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    font-size: 1.6rem; margin: 0 0 1rem; color: var(--accent); letter-spacing: 0.05em;
  }
  h1 svg { width: 2.2rem; height: 2.2rem; flex: none; }

  /* 말하기 버튼 — 화면에서 가장 큰 것 */
  #mic {
    display: block; width: 100%; min-height: 9rem;
    font-size: 2rem; font-weight: 700; color: #fff;
    background: linear-gradient(160deg, var(--mic-top) 0%, var(--mic-bottom) 100%);
    border: none; border-radius: 2.5rem;
    box-shadow: 0 6px 16px rgba(6, 78, 117, 0.30);
    cursor: pointer;
  }
  #mic:active { transform: translateY(2px); box-shadow: 0 2px 8px rgba(6, 78, 117, 0.30); }
  #mic.listening { background: var(--listening); color: #fff; }
  #mic:disabled { background: #ddd; color: #888; box-shadow: none; }

  #status { min-height: 2rem; margin: 0.6rem 0; text-align: center; color: var(--ink-soft); font-size: 1.1rem; }

  /* 검색 — 분류가 틀려도 찾을 수 있는 안전망 */
  #search {
    width: 100%; min-height: 3.5rem; margin-bottom: 0.9rem; padding: 0 1.1rem;
    font-size: 1.3rem; font-family: inherit; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 1.2rem;
  }
  #search:focus { outline: none; border-color: var(--accent); }

  /* 카테고리 필터 — 옆으로 밀어서 본다 */
  #filters { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; }
  #filters button {
    flex: none; min-height: 3.2rem; padding: 0 1.2rem;
    font-size: 1.2rem; font-family: inherit; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 2rem;
    cursor: pointer;
  }
  #filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  /* 정리 버튼은 자주 쓸 것이 아니라 눈에 덜 띄게 — 실수로 누르는 걸 줄인다 */
  #filters button.gear { background: none; border-style: dashed; color: var(--ink-soft); }
  #filters button.gear.on { background: var(--ink-soft); border-color: var(--ink-soft); border-style: solid; color: #fff; }

  /* 카테고리 정리 — 필터 줄 바로 아래로 펼쳐진다 */
  #catPanel { margin: 0 1rem; padding: 1rem; background: var(--card); border: 2px solid var(--line); border-radius: 1.2rem; }
  #catPanel[hidden] { display: none; }
  .catrow { display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0; }
  .catrow span:first-child { flex: 1; font-size: 1.3rem; }
  .catrow .fixed { font-size: 1rem; color: var(--ink-soft); }
  .catrow button {
    min-width: 3.2rem; min-height: 3.2rem; padding: 0 0.5rem; font-size: 1.2rem; font-family: inherit;
    color: var(--ink); background: var(--bg-top); border: 2px solid var(--line); border-radius: 0.9rem; cursor: pointer;
  }
  .catrow button:disabled { opacity: 0.3; cursor: default; }
  .catrow button.danger { color: var(--alert); border-color: var(--alert-line); }
  .add {
    width: 100%; min-height: 3.5rem; margin-top: 0.8rem;
    font-size: 1.2rem; font-family: inherit; font-weight: 700;
    color: var(--accent); background: var(--card); border: 2px solid var(--accent); border-radius: 1rem; cursor: pointer;
  }
  .add.danger { color: var(--alert); border-color: var(--alert); }

  #list { list-style: none; margin: 1rem 0 0; padding: 0 1rem 3rem; }
  #list li {
    margin-bottom: 0.8rem; padding: 0 1rem;
    background: var(--card); border: 2px solid var(--line); border-radius: 1.2rem;
  }

  /* 기록 한 칸 — 누르면 아래가 펼쳐진다 */
  .note { width: 100%; padding: 1.1rem 0; background: none; border: none;
          font-family: inherit; color: inherit; text-align: left; cursor: pointer; }
  .head { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.35rem; }
  .cat { font-size: 1rem; color: var(--accent); font-weight: 700; }
  .badge:not(:empty) {
    font-size: 1.1rem; font-weight: 700; color: var(--badge-ink);
    background: var(--badge-bg); border-radius: 0.6rem; padding: 0.1rem 0.6rem;
  }
  /* keep-all: 한글 단어를 중간에서 안 자른다 / anywhere: 긴 영문·숫자는 잘라서 화면 밖으로 안 나가게 */
  .text { display: block; font-size: 1.6rem; word-break: keep-all; overflow-wrap: anywhere; }

  .panel { padding: 0 0 1.2rem; border-top: 2px dashed var(--line); }
  .panel[hidden] { display: none; }
  .panel p { margin: 0.9rem 0 0.6rem; font-size: 1rem; color: var(--ink-soft); }
  .cats { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.2rem; }
  .cats button {
    min-height: 3.2rem; padding: 0 1.2rem; font-size: 1.2rem; font-family: inherit;
    color: var(--ink); background: var(--bg-top); border: 2px solid var(--line); border-radius: 0.9rem; cursor: pointer;
  }
  .cats button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

  .done-btn, .del {
    width: 100%; min-height: 3.5rem; font-size: 1.3rem; font-family: inherit;
    background: var(--bg-top); border-radius: 1rem; cursor: pointer;
  }
  .done-btn { color: var(--done); border: 2px solid var(--done); margin-bottom: 0.6rem; }
  .del { color: var(--alert); border: 2px solid var(--alert); }

  /* 끝난 기록 — 사라지지 않고 흐려진 채 아래로 내려간다 */
  #list li.done { background: var(--quiet); }
  #list li.done .note { opacity: 0.5; }

  /* 카테고리를 고친 직후에만 뜨는 물음 */
  .learn:not(:empty) { padding: 0.9rem; margin-bottom: 1rem; background: var(--learn-bg); border: 2px solid var(--learn-line); border-radius: 1rem; }
  .learn p { margin: 0 0 0.6rem; font-size: 1.1rem; color: var(--ink); }
  .learn small { color: var(--ink-soft); }

  #empty { padding: 3rem 1rem; text-align: center; color: var(--ink-soft); font-size: 1.3rem; }
  #empty[hidden] { display: none; }

  /* 만든 사람 표시 */
  footer { padding: 0 1rem 2rem; text-align: center; font-size: 0.75rem; color: var(--footer-ink); }
</style>
</head>
<body>

<header>
  <h1>
    <!-- 왕관은 도형 몇 개라 코드로 직접 그린다. 남의 그림을 안 쓰니 라이선스 문제가 없고,
         파일도 안 받으며, 확대해도 안 깨진다. 홈 화면 아이콘(icon.png)도 같은 좌표로 그렸다 -->
    <svg viewBox="-14 -14 128 128" aria-hidden="true">
      <!-- 파랑 타일 = 홈 화면 아이콘의 축소판. 밝은 배경에서 금색 왕관이 묻히는 것도 이걸로 해결된다 -->
      <rect x="-14" y="-14" width="128" height="128" rx="30" fill="#154DD4"/>
      <path d="M6 80 L6 38 L17 58 L28 24 L39 52 L50 16 L61 52 L72 24 L83 58 L94 38 L94 80 Z" fill="#FFD84D"/>
      <circle cx="6" cy="36" r="6.5" fill="#FFD84D"/>
      <circle cx="28" cy="22" r="6.5" fill="#FFD84D"/>
      <circle cx="50" cy="14" r="6.5" fill="#FFD84D"/>
      <circle cx="72" cy="22" r="6.5" fill="#FFD84D"/>
      <circle cx="94" cy="36" r="6.5" fill="#FFD84D"/>
      <rect x="4" y="74" width="92" height="16" rx="4" fill="#F0B92E"/>
      <path d="M50 52 L58 64 L50 74 L42 64 Z" fill="#FFFFFF"/>
    </svg>
    기억왕
  </h1>
  <button id="mic">🎤 말하기</button>
  <p id="status"></p>
  <input id="search" type="search" placeholder="🔍 찾기" autocomplete="off">
  <div id="filters"></div>
</header>

<div id="catPanel" hidden></div>

<p id="empty" hidden>아직 기록이 없어요.<br>위 버튼을 누르고 말해 보세요.</p>
<ul id="list"></ul>

<footer>HSJ · 2026</footer>

<script src="classify.js"></script>
<script src="app.js"></script>
</body>
</html>
